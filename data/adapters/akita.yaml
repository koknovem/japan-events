id: akita
strategy: html
event_url: https://akita-fun.jp/events
urls_by_lang:
  en: "https://akita-fun.jp/en/events"
  ja: "https://akita-fun.jp/events"
  zh-TW: "https://stayakita.com/zh-tw/"
  zh-CN: "https://stayakita.com/zh-cn/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".news-list li"
  - article
  - li
fields:
  title:
    - a
    - h2
    - h3
  period:
    - time
    - ".date"
    - li
  url:
    - a
notes: 秋田県観光連盟 アキタファン date search is form fields q[event_terms_end_date_gteq] / q[event_terms_start_date_lteq]; GET q[] returns 500 so the Python adapter fills those inputs.
