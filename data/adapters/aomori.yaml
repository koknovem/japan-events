id: aomori
strategy: html
event_url: https://aomori-tourism.com/en/event/index.html
urls_by_lang:
  en: "https://aomori-tourism.com/en/event/index.html"
  ja: "https://aomori-tourism.com/event/index.html"
  zh-TW: "https://aomori-tourism.com/tw/event/index.html"
  zh-CN: "https://aomori-tourism.com/cn/event/index.html"
date_picker: false
wait_ms: 1500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- .event-list li
- li.event
- article
- .c-event-item
- .eventBox
- section .list li
fields:
  title:
  - h2
  - h3
  - .title
  - a
  period:
  - time
  - .date
  - .period
  - dd
  url:
  - a[href*='detail']
  - a[href]
  area:
  - .area
  - .category
notes: Seasonal/relative dates common; absolute ISO rare
