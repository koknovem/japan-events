id: chiba
strategy: html
event_url: "https://maruchiba.jp/event/index.html?days={ymd}"
urls_by_lang:
  en: "https://maruchiba.jp/event/index.html?days={ymd}#en"
  ja: "https://maruchiba.jp/event/index.html?days={ymd}"
  zh-TW: "https://maruchiba.jp/event/index.html?days={ymd}#zh-TW"
  zh-CN: "https://maruchiba.jp/event/index.html?days={ymd}#zh-CN"
date_picker: false
wait_ms: 2500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".result-list li"
  - ".event-list li"
  - article
  - ".event-item"
  - li
fields:
  title:
    - h3
    - h2
    - a
  period:
    - ".date"
    - time
    - "[class*='date']"
  url:
    - a
notes: maruchiba calendar search encodes selected days as days=YYYYMMDD; visitchiba /event/ 404s
