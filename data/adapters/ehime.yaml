id: ehime
strategy: html
event_url: "https://www.iyokannet.jp/event/list?program_date[]={ymd}"
urls_by_lang:
  en: "https://www.visitehimejapan.com/en/things-to-do/#anchor-festival-events"
  ja: "https://www.iyokannet.jp/event/list?program_date[]={ymd}"
  zh-TW: "https://www.visitehimejapan.com/zh-tw/things-to-do/#anchor-festival-events"
  zh-CN: "https://www.visitehimejapan.com/zh-cn/things-to-do/#anchor-festival-events"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - article
  - ".event-list li"
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: いよ観ネット /event/list filters with program_date[]=YYYYMMDD (not the unfiltered /event index). Visit Ehime EN/zh festival anchors are not date-filtered.
