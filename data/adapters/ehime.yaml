id: ehime
strategy: html
event_url: https://www.iyokannet.jp/event
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: 愛媛県観光協会 いよ観ネット event search
