id: fukushima
strategy: html
event_url: "https://www.tif.ne.jp/jp/entry/?type=event&eventStart={date}&eventEnd={date}&search=on"
urls_by_lang:
  en: "https://fukushima.travel/en/events/"
  ja: "https://www.tif.ne.jp/jp/entry/?type=event&eventStart={date}&eventEnd={date}&search=on"
  zh-TW: "https://fukushima.travel/zh-tw/events/"
  zh-CN: "https://fukushima.travel/zh-cn/events/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - article
  - ".entry-list li"
  - ".list li"
  - "li"
fields:
  title:
    - h2
    - h3
    - a
  period:
    - time
    - ".date"
    - "[class*='date']"
  url:
    - a
notes: ふくしまの旅 React calendar search uses eventStart/eventEnd ISO dates plus search=on, not the unfiltered ?type=event index. fukushima.travel EN/ZH listings have no day filter.
