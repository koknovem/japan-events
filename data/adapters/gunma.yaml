id: gunma
strategy: html
event_url: "https://gunma-kanko.jp/events?q[event_terms_end_date_gteq]={date}&q[event_terms_start_date_lteq]={date}"
urls_by_lang:
  en: "https://gunma-kanko.jp/events?q[event_terms_end_date_gteq]={date}&q[event_terms_start_date_lteq]={date}#en"
  ja: "https://gunma-kanko.jp/events?q[event_terms_end_date_gteq]={date}&q[event_terms_start_date_lteq]={date}"
  zh-TW: "https://gunma-kanko.jp/events?q[event_terms_end_date_gteq]={date}&q[event_terms_start_date_lteq]={date}#zh-TW"
  zh-CN: "https://gunma-kanko.jp/events?q[event_terms_end_date_gteq]={date}&q[event_terms_start_date_lteq]={date}#zh-CN"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - time
    - ".date"
  url:
    - "a[href*='/events/']"
    - a
notes: gunma-kanko Ransack overlap filter; visit-gunma inbound has no dated calendar
