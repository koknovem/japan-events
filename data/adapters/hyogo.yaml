id: hyogo
strategy: html
event_url: "https://www.hyogo-tourism.jp/event/index_1_2____1____.html?days={ymd}"
urls_by_lang:
  en: "https://www.hyogo-tourism.jp/en/event/"
  ja: "https://www.hyogo-tourism.jp/event/index_1_2____1____.html?days={ymd}"
  zh-TW: "https://www.hyogo-tourism.jp/zh-TW/event/"
  zh-CN: "https://www.hyogo-tourism.jp/zh-CN/event/"
date_picker: false
wait_ms: 2500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event_list > li"
  - ".eventList > li"
  - "ul.list > li"
  - "[class*='event'] li"
  - "a[href*='detail_']"
fields:
  title:
    - ".title"
    - "h2"
    - "h3"
    - "a"
  period:
    - "time"
    - ".date"
    - ".period"
    - ".day"
  url:
    - "a[href*='detail_']"
    - "a"
notes: 兵庫観光ナビ JA calendar search uses days=YYYYMMDD; EN/ZH paths stay unique (no dated CMS filename)
