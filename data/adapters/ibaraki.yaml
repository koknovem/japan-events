id: ibaraki
strategy: html
event_url: https://www.ibarakiguide.jp/event.php
urls_by_lang:
  en: "https://www.ibarakiguide.jp/en/event.php"
  ja: "https://www.ibarakiguide.jp/event.php"
  zh-TW: "https://visit.ibarakiguide.jp/zh-hant/"
  zh-CN: "https://visit.ibarakiguide.jp/zh-hans/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- .eventList li
- .event_list li
- li
- .listBox
- .resultList li
fields:
  title:
  - a
  - h2
  - h3
  - .title
  period:
  - .date
  - time
  - li
  - p
  url:
  - a[href*='detail']
  - a
  area:
  - .area
wait_for: .eventSearchBox, .eventList, body
notes: 観光いばらき event.php GET search_start_year/month/day + search_end_* (Python adapter, split Y/M/D). EN event.php 404s; visit.ibarakiguide.jp ZH has no day filter.
