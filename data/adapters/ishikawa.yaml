id: ishikawa
strategy: html
event_url: "https://www.hot-ishikawa.jp/event/index_1_2____1____.html?days={ymd}"
urls_by_lang:
  en: "https://www.ishikawatravel.jp/en/event/"
  ja: "https://www.hot-ishikawa.jp/event/index_1_2____1____.html?days={ymd}"
  zh-TW: "https://www.ishikawatravel.jp/tw/event/"
  zh-CN: "https://www.ishikawatravel.jp/cn/event/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".spot"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - "a[href*='detail']"
    - a
notes: ほっと石川旅ねっと calendar search uses days=YYYYMMDD on the encoded listing filename
