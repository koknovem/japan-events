id: iwate
strategy: html
event_url: "https://iwatetabi.jp/events/?ondate_start={date}&ondate_end={date}"
urls_by_lang:
  en: "https://iwatetabi.jp/en/events/?ondate_start={date}&ondate_end={date}"
  ja: "https://iwatetabi.jp/events/?ondate_start={date}&ondate_end={date}"
  zh-TW: "https://iwatetabi.jp/tw/events/?ondate_start={date}&ondate_end={date}"
  zh-CN: "https://iwatetabi.jp/cn/events/?ondate_start={date}&ondate_end={date}"
date_picker: false
wait_ms: 1200
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- .event-item
- article
- .card
- li
notes: いわての旅 event search uses ondate_start/ondate_end ISO date inputs, not the unfiltered /events/ index
