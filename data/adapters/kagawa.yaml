id: kagawa
strategy: html
event_url: "https://www.my-kagawa.jp/event/list?program_date[]={ymd}"
urls_by_lang:
  en: "https://www.my-kagawa.jp/en/see-and-do"
  ja: "https://www.my-kagawa.jp/event/list?program_date[]={ymd}"
  zh-TW: "https://www.my-kagawa.jp/zh-TW"
  zh-CN: "https://www.my-kagawa.jp/zh_CN/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".result-list li"
  - ".event-list li"
  - article
  - li
fields:
  title:
    - h3
    - h2
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: うどん県旅ネット event/list filters with program_date[]=YYYYMMDD. /en/event/ 404s — EN/zh sites have no dated event list.
