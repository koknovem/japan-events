id: kanagawa
strategy: html
event_url: "https://www.kanagawa-kankou.or.jp/event?eventDate={date}"
urls_by_lang:
  en: "https://www.kanagawa-kankou.or.jp/event?eventDate={date}#en"
  ja: "https://www.kanagawa-kankou.or.jp/event?eventDate={date}"
  zh-TW: "https://www.kanagawa-kankou.or.jp/event?eventDate={date}#zh-TW"
  zh-CN: "https://www.kanagawa-kankou.or.jp/event?eventDate={date}#zh-CN"
date_picker: false
wait_ms: 2500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".result-list li"
  - ".event-list li"
  - article
  - li
fields:
  title:
    - h3
    - h2
    - a
  period:
    - ".date"
    - time
  url:
    - "a[href*='/event/']"
    - a
notes: 観光かながわNOW eventDate=YYYY-MM-DD; visitkanagawa inbound was unreachable here
