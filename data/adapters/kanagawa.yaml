id: kanagawa
strategy: html
event_url: https://www.kanagawa-kankou.or.jp/event/
urls_by_lang:
  en: "https://www.visitkanagawa.jp/en/events/"
  ja: "https://www.kanagawa-kankou.or.jp/event/"
  zh-TW: "https://www.visitkanagawa.jp/zh-tw/"
  zh-CN: "https://www.visitkanagawa.jp/zh-cn/"
date_picker: true
wait_ms: 2500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".result-list li"
  - ".event-list li"
  - article
  - li
fields:
  title:
    - h3
    - h2
    - a
  period:
    - ".date"
    - time
  url:
    - "a[href*='/event/']"
    - a
notes: 神奈川県観光協会 観光かながわNOW calendar search
