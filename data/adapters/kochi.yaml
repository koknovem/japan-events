id: kochi
strategy: html
event_url: https://kochi-tabi.jp/search_event.html
urls_by_lang:
  en: "https://visitkochijapan.com/en/highlights/event"
  ja: "https://kochi-tabi.jp/search_event.html"
  zh-TW: "https://visitkochijapan.com/tc/highlights/event"
  zh-CN: "https://visitkochijapan.com/sc/highlights/event"
date_picker: true
wait_ms: 2500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
    - td
  url:
    - a
notes: 高知県観光コンベンション協会 こうち旅ネット calendar search
