id: mie
strategy: html
event_url: "https://www.kankomie.or.jp/event?q%5Bevent_terms_end_date_gteq%5D={date}&q%5Bevent_terms_start_date_lteq%5D={date}"
urls_by_lang:
  en: "https://visitmie-japan.travel/en/events/"
  ja: "https://www.kankomie.or.jp/event?q%5Bevent_terms_end_date_gteq%5D={date}&q%5Bevent_terms_start_date_lteq%5D={date}"
  zh-TW: "https://visitmie-japan.travel/tw/"
  zh-CN: "https://visitmie-japan.travel/cn/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - time
    - ".date"
  url:
    - "a[href*='/event/']"
    - a
notes: 観光三重 Ransack overlap filter end_date>=date and start_date<=date
