  ja: "https://www.kankomie.or.jp/event"
  zh-TW: "https://visitmie-japan.travel/tw/"
  zh-CN: "https://visitmie-japan.travel/cn/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - time
    - ".date"
  url:
    - "a[href*='/event/']"
    - a
notes: 三重県観光連盟 観光三重 dated event index
