id: nagano
strategy: html
event_url: "https://db.go-nagano.net/event/?topics_ext_options_search=1&scope_search_ext_04_from={date}&scope_search_ext_02_to={date}"
urls_by_lang:
  en: "https://db.go-nagano.net/event/?topics_ext_options_search=1&scope_search_ext_04_from={date}&scope_search_ext_02_to={date}#en"
  ja: "https://db.go-nagano.net/event/?topics_ext_options_search=1&scope_search_ext_04_from={date}&scope_search_ext_02_to={date}"
  zh-TW: "https://db.go-nagano.net/event/?topics_ext_options_search=1&scope_search_ext_04_from={date}&scope_search_ext_02_to={date}#zh-TW"
  zh-CN: "https://db.go-nagano.net/event/?topics_ext_options_search=1&scope_search_ext_04_from={date}&scope_search_ext_02_to={date}#zh-CN"
date_picker: false
wait_ms: 1200
harvest_fallback: true
use_card_text_as_period: true
listing_urls:
- "https://db.go-nagano.net/event/?topics_ext_options_search=1&scope_search_ext_04_from={date}&scope_search_ext_02_to={date}"
notes: Go NAGANO event DB overlap filter; www.go-nagano.net/{lang}/event/ hreflang targets 404
