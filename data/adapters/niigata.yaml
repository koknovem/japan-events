id: niigata
strategy: html
event_url: "https://niigata-kankou.or.jp/event/list?program_date[]={ymd}"
urls_by_lang:
  en: "https://niigata-kankou.or.jp/event/list?program_date[]={ymd}#en"
  ja: "https://niigata-kankou.or.jp/event/list?program_date[]={ymd}"
  zh-TW: "https://enjoyniigata.com/tc/event/list?program_date[]={ymd}"
  zh-CN: "https://enjoyniigata.com/cn/event/list?program_date[]={ymd}"
date_picker: false
wait_ms: 1200
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- article
- .event
- .card
- li
notes: にいがた観光ナビ program_date[]=YYYYMMDD; discover-niigata English events page has no date filter
