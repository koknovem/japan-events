id: okayama
strategy: html
event_url: https://www.okayama-kanko.jp/event/
urls_by_lang:
  en: "https://www.okayama-japan.jp/en/event"
  ja: "https://www.okayama-kanko.jp/event/"
  zh-TW: "https://www.okayama-japan.jp/tw/event"
  zh-CN: "https://www.okayama-japan.jp/cn/event"
date_picker: true
wait_ms: 1500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- .spot_list_item
- .ejs-tabs-content-item
- article
- li
- a[href*='detail_']
fields:
  title:
  - a
  - h2
  - h3
  - .title
  period:
  - .date
  - time
  - .month
  category:
  - .category
  url:
  - a[href*='detail_']
  - a
notes: JA okayama-kanko.jp/event uses searchDay data-ymd calendar (okayamajapan.jp/event 404). EN/zh okayama-japan.jp event pages are month-grouped traditional festivals, not a day filter.
