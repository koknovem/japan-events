id: okayama
strategy: html
event_url: "https://www.okayama-kanko.jp/event/index_1_2____1______.html?days={ymd}"
urls_by_lang:
  en: "https://www.okayama-japan.jp/en/event"
  ja: "https://www.okayama-kanko.jp/event/index_1_2____1______.html?days={ymd}"
  zh-TW: "https://www.okayama-japan.jp/tw/event"
  zh-CN: "https://www.okayama-japan.jp/cn/event"
date_picker: false
wait_ms: 1500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- .spot_list_item
- .ejs-tabs-content-item
- article
- li
- a[href*='detail_']
fields:
  title:
  - a
  - h2
  - h3
  - .title
  period:
  - .date
  - time
  - .month
  category:
  - .category
  url:
  - a[href*='detail_']
  - a
notes: >-
  Official JA filter is encoded listing index_1_2____1______.html?days=YYYYMMDD
  (1148 unfiltered -> 69 on 2026-09-08). Bare /event/?days= does not filter.
  EN/zh okayama-japan.jp event pages are month-grouped festivals, not a day filter.
