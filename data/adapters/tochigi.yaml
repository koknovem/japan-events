id: tochigi
strategy: html
event_url: https://www.tochigiji.or.jp/event/
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: 栃木県観光物産協会 とちぎ旅ネット event search
