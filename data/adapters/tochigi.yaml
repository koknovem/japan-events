id: tochigi
strategy: html
event_url: https://www.tochigiji.or.jp/event/
urls_by_lang:
  en: "https://www.visit-tochigi.com/seasons-in-tochigi/events/"
  ja: "https://www.tochigiji.or.jp/event/"
  zh-TW: "https://www.visit-tochigi.com/zh-tw/"
  zh-CN: "https://www.visit-tochigi.com/zh-cn/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: とちぎ旅ネット filter is month=YYYY-MM (no day URL). Python adapter appends month= for tochigiji.or.jp. visit-tochigi.com EN/ZH have no month filter.
