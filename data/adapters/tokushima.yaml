id: tokushima
strategy: html
event_url: https://www.awanavi.jp/event/
urls_by_lang:
  en: "https://discovertokushima.net/en/"
  ja: "https://www.awanavi.jp/event/?event-yearmonth[]={month_underscore}"
  zh-TW: "https://discovertokushima.net/tw/"
  zh-CN: "https://discovertokushima.net/cn/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: 阿波ナビ /event/ month filter is event-yearmonth[]=YYYY_MM. discovertokushima /en/events 404s.
