id: toyama
strategy: html
event_url: "https://www.info-toyama.com/events?rte[]={date}"
urls_by_lang:
  en: "https://www.info-toyama.com/events?rte[]={date}#en"
  ja: "https://www.info-toyama.com/events?rte[]={date}"
  zh-TW: "https://www.info-toyama.com/events?rte[]={date}#zh-TW"
  zh-CN: "https://www.info-toyama.com/events?rte[]={date}#zh-CN"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: とやま観光ナビ rte[]=ISO date; visit-toyama-japan.com/en/events 404
