id: toyama
strategy: html
event_url: https://www.info-toyama.com/events
urls_by_lang:
  en: "https://visit-toyama-japan.com/en/events/"
  ja: "https://www.info-toyama.com/events"
  zh-TW: "https://visit-toyama-japan.com/zh-TW/events/"
  zh-CN: "https://visit-toyama-japan.com/zh-CN/events/"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".event-list li"
  - article
  - ".card"
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
  url:
    - a
notes: とやま観光推進機構 とやま観光ナビ events index
