id: wakayama
strategy: html
event_url: https://visitwakayama.jp/en/events/index.html
urls_by_lang:
  en: "https://visitwakayama.jp/en/events/index.html"
  ja: "https://www.wakayama-kanko.or.jp/events/"
  zh-TW: "https://visitwakayama.jp/zh-TW/events/index.html"
  zh-CN: "https://visitwakayama.jp/zh-CN/"
date_picker: true
wait_ms: 1500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
- article
- .event
- li
- .card
- a[href*='detail_']
fields:
  title:
  - a
  - h2
  - h3
  period:
  - time
  - .date
  url:
  - a[href*='detail_']
  - a
notes: JA wakayama-kanko and EN/zh-TW visitwakayama event pages use searchDay data-ymd calendars (no dated query). zh-CN has no /events/ listing.
