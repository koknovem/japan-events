id: yamaguchi
strategy: html
event_url: "https://yamaguchi-tourism.jp/event/index_1_2_____1___________.html?days={ymd}"
urls_by_lang:
  en: "https://www.visit-jy.com/en/spots?category=166"
  ja: "https://yamaguchi-tourism.jp/event/index_1_2_____1___________.html?days={ymd}"
  zh-TW: "https://www.visit-jy.com/zh-tw/spots?category=166"
  zh-CN: "https://www.visit-jy.com/zh-cn/spots?category=166"
date_picker: false
wait_ms: 2500
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".result-list li"
  - ".event-list li"
  - article
  - li
fields:
  title:
    - h3
    - h2
    - a
  period:
    - ".date"
    - time
  url:
    - "a[href*='detail_']"
    - a
notes: >-
  Official JA filter is encoded listing index_1_2_____1___________.html?days=YYYYMMDD
  (735 unfiltered -> 27 on 2026-09-08). Bare /event/?days= does not filter.
  EN/zh visit-jy spots?category=166 is the event category, not a day calendar.
