id: yamanashi
strategy: html
event_url: "https://www.yamanashi-kankou.jp/search/event.php"
urls_by_lang:
  en: "https://www.yamanashi-kankou.jp/search/event.php?y={year}&m={month}&d={day}&mode=event&hl=en"
  ja: "https://www.yamanashi-kankou.jp/search/event.php?y={year}&m={month}&d={day}&mode=event"
  zh-TW: "https://www.yamanashi-kankou.jp/search/event.php?y={year}&m={month}&d={day}&mode=event&hl=zh-TW"
  zh-CN: "https://www.yamanashi-kankou.jp/search/event.php?y={year}&m={month}&d={day}&mode=event&hl=zh-CN"
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".search-result li"
  - article
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
    - td
  url:
    - a
notes: official day filter is y={year}&m={month}&d={day}&mode=event; inbound /english/event/ and /chinese_*/event/ 404
