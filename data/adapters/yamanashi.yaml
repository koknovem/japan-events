id: yamanashi
strategy: html
event_url: https://www.yamanashi-kankou.jp/search/event.php
date_picker: false
wait_ms: 2000
harvest_fallback: true
use_card_text_as_period: true
card_selectors:
  - ".search-result li"
  - article
  - li
fields:
  title:
    - h2
    - h3
    - a
  period:
    - ".date"
    - time
    - td
  url:
    - a
notes: やまなし観光推進機構 event search with calendar params
